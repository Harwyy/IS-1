services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_api
      POSTGRES_USER: secure_api
      POSTGRES_PASSWORD: secure_api_password
    ports:
      # 5432 on the host may already be occupied by a local PostgreSQL.
      # The API uses the internal Docker address db:5432 and is unaffected.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_api -d secure_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/secure_api
      DB_USERNAME: secure_api
      DB_PASSWORD: secure_api_password
      JWT_SECRET: change-this-development-secret-key-at-least-32-bytes-long
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
