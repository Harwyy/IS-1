server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_api}
    username: ${DB_USERNAME:secure_api}
    password: ${DB_PASSWORD:secure_api_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
